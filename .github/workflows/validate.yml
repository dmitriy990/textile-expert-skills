name: Validate skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest), so 3.9 runs on 24.04
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/validate_package.py --self-test
      - run: python3 scripts/test_hooks.py
